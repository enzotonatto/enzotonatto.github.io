<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enzo Tonatto — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a1a;
    --card: #242424;
    --card-hover: #2a2a2a;
    --border: #2f2f2f;
    --accent: #f0a500;
    --text: #e8e8e8;
    --muted: #888;
    --radius: 18px;
  }

  html { scroll-behavior: smooth; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(26,26,26,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s;
  }
  nav.scrolled { border-bottom-color: var(--border); }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    color: var(--muted);
    font-size: 15px;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }

  .btn-talk {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .btn-talk:hover { background: var(--card-hover); border-color: #444; }

  /* MAIN GRID */
  main {
    padding: 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* TOP ROW */
  .top-row {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 16px;
    flex: 0.7;
    min-height: 0;
  }

  /* BIO CARD */
  .bio-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 36px 36px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }
  .bio-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 0% 100%, rgba(240,165,0,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .bio-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .bio-name {
    font-family: 'Syne', sans-serif;
    font-size: 46px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    margin-top: 8px;
    animation: fadeUp 0.7s 0.1s ease both;
  }
  .bio-desc {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.65;
    margin-top: 14px;
    font-weight: 300;
    animation: fadeUp 0.7s 0.2s ease both;
  }
  .bio-arrow {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    align-self: flex-end;
    margin-top: 18px;
    transition: transform 0.2s;
    border: none;
  }
  .bio-arrow:hover { transform: scale(1.1) rotate(15deg); }
  .bio-arrow svg { width: 18px; height: 18px; fill: #111; }

  /* SOCIAL GRID */
  .social-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    animation: fadeUp 0.6s 0.15s ease both;
  }
  .social-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s, border-color 0.2s;
  }
  .social-card:hover {
    background: var(--card-hover);
    border-color: #444;
    transform: translateY(-2px);
  }
  .social-card svg {
    width: 32px;
    height: 32px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.5;
    transition: stroke 0.2s;
  }
  .social-card.github:hover    { background: rgba(158,158,158,0.08); border-color: rgba(158,158,158,0.3); }
  .social-card.linkedin:hover  { background: rgba(10,102,194,0.08);  border-color: rgba(10,102,194,0.3); }
  .social-card.email:hover     { background: rgba(234,67,53,0.08);   border-color: rgba(234,67,53,0.3); }
  .social-card.resume:hover  { background: rgba(240,165,0,0.08);   border-color: rgba(240,165,0,0.3); }
  .social-card.github:hover svg   { stroke: #ffffff; }
  .social-card.linkedin:hover svg { stroke: #0a66c2; }
  .social-card.email:hover svg    { stroke: #ea4335; }
  .social-card.resume:hover svg   { stroke: var(--accent); }

  /* HEADLINE CARD */
  .headline-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid var(--border);
    animation: fadeUp 0.6s 0.25s ease both;
    position: relative;
    overflow: hidden;
  }
  .headline-card::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,165,0,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .headline-tag {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .headline-text {
    font-family: 'Syne', sans-serif;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: var(--accent);
  }
  .headline-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 18px;
    line-height: 1.6;
    font-weight: 300;
  }
  .skill-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
  }
  .pill {
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: rgba(255,255,255,0.03);
  }

  /* BOTTOM ROW */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }

  /* SKILLS CARD */
  .skills-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    animation: fadeUp 0.6s 0.3s ease both;
  }
  .skills-icons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    flex: 1;
    margin-bottom: 18px;
  }
  .skill-icon {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: background 0.2s, transform 0.2s;
    cursor: default;
  }
  .skill-icon:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-top: 2px;
  }
  .arrow-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .arrow-btn:hover { background: var(--accent); transform: scale(1.05) rotate(15deg); }
  .arrow-btn:hover svg { stroke: #111; }
  .arrow-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }

  /* SHOWCASE CARD */
  .showcase-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 28px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.6s 0.35s ease both;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .project-item-inner {
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .showcase-marquee-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    margin-bottom: 18px;
  }
  .marquee-label {
    font-family: 'Syne', sans-serif;
    font-size: 60px;
    font-weight: 800;
    color: rgba(255,255,255,0.04);
    white-space: nowrap;
    letter-spacing: -2px;
    line-height: 1;
    animation: marquee 12s linear infinite;
    display: inline-block;
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .projects-carousel {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .projects-track {
    display: flex;
    gap: 10px;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .project-item {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    background: #1e1e1e;
    transition: border-color 0.2s, box-shadow 0.2s;
    flex: 0 0 calc((100%) / 4 - 8px);
  }
  .project-item:hover { border-color: var(--item-accent, var(--accent)); box-shadow: 0 0 0 1px var(--item-accent-glow, rgba(240,165,0,0.2)), inset 0 0 30px var(--item-accent-dim, rgba(240,165,0,0.04)); }
  .project-item-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }
  .project-mockup {
    width: 90%;
    height: 80%;
    border-radius: 8px;
    background: linear-gradient(135deg, #2a2a2a, #333);
    border: 1px solid #3a3a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }
  .project-mockup-bar {
    width: 80%;
    height: 5px;
    border-radius: 3px;
    background: rgba(240,165,0,0.4);
  }
  .project-mockup-bar.thin { height: 3px; background: rgba(255,255,255,0.1); }
  .project-tag {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,0.5);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .project-overlay {
    position: absolute;
    inset: 0;
    background: var(--item-overlay, rgba(240,165,0,0.08));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .project-item:hover .project-overlay { opacity: 1; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 10px 48px;
    text-align: center;
    flex-shrink: 0;
  }
  .footer-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 18px;
  }
  .footer-links {
    display: flex;
    justify-content: center;
    gap: 32px;
    list-style: none;
    margin-bottom: 18px;
  }
  .footer-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--text); }
  .footer-copy {
    font-size: 13px;
    color: #555;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* PROJECT DETAIL */
  #project-detail {
    padding: 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    animation: fadeUp 0.35s ease both;
  }
  .detail-back {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .detail-back-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    transition: color 0.2s;
  }
  .detail-back-btn:hover { color: var(--text); }
  .detail-back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .detail-badge {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    background: rgba(240,165,0,0.08);
    border: 1px solid rgba(240,165,0,0.2);
    padding: 4px 12px;
    border-radius: 50px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .detail-info {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .detail-icon-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .detail-icon-img {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .detail-screenshots-panel {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 22px 22px 14px;
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .detail-screenshots-panel::-webkit-scrollbar { width: 4px; }
  .detail-screenshots-panel::-webkit-scrollbar-track { background: transparent; }
  .detail-screenshots-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .screenshots-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 14px;
    flex: 1;
  }
  .screenshot-img {
    width: 100%;
    aspect-ratio: 9/19.5;
    border-radius: 14px;
    border: 1px solid var(--border);
    object-fit: cover;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
    display: block;
  }
  .screenshot-img:hover { border-color: var(--detail-accent, var(--accent)); transform: scale(1.02); }
  .detail-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  .detail-card-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .detail-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.15;
    margin-bottom: 0;
  }
  .detail-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    font-weight: 300;
  }
  .detail-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detail-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .detail-meta-item { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .detail-meta-value {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
</style>
</head>
<body>

<nav id="nav">
  <div class="logo">Enzo</div>
  <a class="btn-talk" href="https://wa.me/5551998292204" target="_blank" rel="noopener">Let's talk</a>
</nav>

<main>
  <!-- TOP ROW -->
  <div class="top-row">

    <!-- BIO -->
    <div class="bio-card">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div>
          <p class="bio-label">iOS Developer</p>
          <h1 class="bio-name">Enzo<br>Tonatto</h1>
          <p class="bio-desc">iOS developer crafting native apps and games — from laundry services to retro survival games. Focused on clean architecture, great UX and Swift.</p>
        </div>
        <img src="assets/memoji.png" alt="Enzo Memoji" style="width:100px; height:100px; object-fit:contain; flex-shrink:0; margin-left:12px; margin-top:4px;">
      </div>
    </div>

    <!-- SOCIAL -->
    <div class="social-grid">
      <!-- GitHub -->
      <a class="social-card github" href="https://github.com/enzotonatto" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
      </a>
      <!-- Email -->
      <a class="social-card email" href="mailto:enzotonatto@gmail.com">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </a>
      <!-- LinkedIn -->
      <a class="social-card linkedin" href="https://www.linkedin.com/in/enzotonatto/" target="_blank" rel="noopener">

          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>

          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <!-- Resume (futuro) -->
      <a class="social-card resume" href="assets/resume.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </a>
    </div>

  </div>

  <!-- BOTTOM ROW -->
  <div class="bottom-row">

    <!-- SHOWCASE -->
    <div class="showcase-card">
      <div class="card-footer" style="margin-bottom:16px;">
        <div>
          <p class="card-label">Showcase</p>
          <p class="card-title">Projects</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="arrow-btn" id="projPrev" onclick="changePage(-1)">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
<button class="arrow-btn" id="projNext" onclick="changePage(1)">
            <svg viewBox="0 0 24 24"><path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="projects-carousel">
      <div class="projects-track" id="projectsTrack">
        <!-- Page 1 -->
        <div class="project-item" onclick="openDetail(0)">
          <div class="project-item-inner"></div>
          <div class="project-overlay"></div>
          <span class="project-tag">iOS</span>
        </div>
        <div class="project-item" onclick="openDetail(1)">
          <div class="project-item-inner"></div>
          <div class="project-overlay"></div>
          <span class="project-tag">iOS Game</span>
        </div>
        <div class="project-item" onclick="openDetail(2)">
          <div class="project-item-inner"></div>
          <div class="project-overlay"></div>
          <span class="project-tag">iOS Game</span>
        </div>
        <div class="project-item" onclick="openDetail(3)">
          <div class="project-item-inner"></div>
          <div class="project-overlay"></div>
          <span class="project-tag">iOS</span>
        </div>
      </div>
      </div>
    </div>

  </div>
</main>

<section id="project-detail" style="display:none">
  <div class="detail-back">
    <button class="detail-back-btn" onclick="closeDetail()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
    <span class="detail-badge" id="detailTag"></span>
  </div>
  <div class="detail-grid">
    <div class="detail-info">
      <div class="detail-card" style="flex:1.4">
        <div class="detail-icon-row">
          <img id="detailIcon" class="detail-icon-img" src="" alt="" style="display:none">
          <div>
            <p class="detail-card-label" style="margin-bottom:2px">Project</p>
            <h2 class="detail-title" id="detailTitle" style="margin-bottom:0"></h2>
          </div>
        </div>
        <p class="detail-desc" id="detailDesc"></p>
      </div>
      <div class="detail-card">
        <p class="detail-card-label">Tech Stack</p>
        <div class="detail-pills" id="detailTech"></div>
      </div>
      <div class="detail-card">
        <div class="detail-meta-row">
          <div class="detail-meta-item">
            <span class="detail-card-label">Year</span>
            <span class="detail-meta-value" id="detailYear"></span>
          </div>
          <div class="detail-meta-item" style="text-align:center">
            <span class="detail-card-label">Status</span>
            <span class="detail-meta-value" id="detailStatus"></span>
          </div>
          <div class="detail-meta-item" style="text-align:right">
            <span class="detail-card-label">Type</span>
            <span class="detail-meta-value" id="detailType"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="detail-screenshots-panel" id="detailScreenshots" style="display:none">
      <p class="detail-card-label">Screenshots</p>
      <div class="screenshots-grid" id="screenshotsRow"></div>
    </div>
  </div>
</section>

<script>
  // Project data
  const projects = [
    { tag:'iOS',      title:'Lavanda',        desc:'Native iOS laundry service app with a full order flow — clothing selection, address entry, order summary, payment and confirmation.', tech:['Swift','UIKit','MVVM'],        year:'2025', status:'Complete', type:'Mobile', logo:'assets/projects/lavanda/lavandaIcon.png', screenshots:['assets/projects/lavanda/screenshoot1.png','assets/projects/lavanda/screenshoot2.png','assets/projects/lavanda/screenshoot3.png','assets/projects/lavanda/screenshoot4.png','assets/projects/lavanda/screenshoot5.png','assets/projects/lavanda/screenshoot6.png','assets/projects/lavanda/screenshoot7.png','assets/projects/lavanda/screenshoot8.png'], gradient:'linear-gradient(135deg,#20222a,#22252d)', bar:'rgba(100,140,255,0.5)', accent:'#8b5cf6' },
    { tag:'iOS Game', title:'Sardine Escape', desc:'Vertical endless climber for iOS — tilt or tap to jump across platforms, collect coins, dodge sea urchins and jellyfish, and unlock skins.',  tech:['Swift','SpriteKit','SwiftUI'], year:'2026', status:'Ongoing',  type:'Game',   logo:'assets/projects/sardine/sardineIcon.jpg', screenshots:['assets/projects/sardine/inicial.png','assets/projects/sardine/jogo.png','assets/projects/sardine/coin.png','assets/projects/sardine/loja.png','assets/projects/sardine/skin.png','assets/projects/sardine/image2.png','assets/projects/sardine/gameOver.png'], gradient:'linear-gradient(135deg,#0d2a3a,#0f3347)', bar:'rgba(61,201,212,0.5)', accent:'#3dc9d4' },
    { tag:'iOS Game', title:'Shiro',          desc:'Fast-paced retro survival game for iOS — dodge snowballs, logs and wind using dashes and invincibility, with a Game Center leaderboard.',     tech:['Swift','SpriteKit','SwiftUI'], year:'2024', status:'Complete', type:'Game',   logo:'assets/projects/shiro/icone.svg',          screenshots:['assets/projects/shiro/menu.png','assets/projects/shiro/gameplay.png','assets/projects/shiro/leaderboard.png','assets/projects/shiro/pause.png','assets/projects/shiro/settings.png','assets/projects/shiro/gameOver.png'],  gradient:'linear-gradient(135deg,#1a1f2e,#1e2535)', bar:'rgba(245,180,48,0.5)',  accent:'#f5b430' },
    { tag:'iOS',      title:'Break!',         desc:'Discover a new playful challenge every 24h, complete it, earn Collectible Badges and build a Streak that makes every day feel legendary.',        tech:['Swift','SwiftUI','MVVM'],      year:'2025', status:'Complete', type:'Mobile', logo:'assets/projects/break/breakIcon.png',      screenshots:['assets/projects/break/challenge.png','assets/projects/break/challengeDone.png','assets/projects/break/takePicture.png','assets/projects/break/rewardWon.png','assets/projects/break/rewardsGallery.png','assets/projects/break/calendar.png'],                                                                                                                                                                                                                                                  gradient:'linear-gradient(135deg,#1f1a2e,#261e3a)', bar:'rgba(255,107,67,0.5)',  accent:'#ff6b43' },
  ];

  function openDetail(index) {
    const p = projects[index];
    document.getElementById('detailTag').textContent   = p.tag;
    document.getElementById('detailTitle').textContent = p.title;
    document.getElementById('detailDesc').textContent   = p.desc;
    document.getElementById('detailYear').textContent   = p.year;
    document.getElementById('detailStatus').textContent = p.status;
    document.getElementById('detailType').textContent   = p.type;
    const iconEl = document.getElementById('detailIcon');
    if (p.logo) {
      iconEl.src = p.logo;
      iconEl.style.display = 'block';
    } else {
      iconEl.style.display = 'none';
    }
    const techEl = document.getElementById('detailTech');
    techEl.innerHTML = p.tech.map(t => `<span class="pill">${t}</span>`).join('');
    const ssEl  = document.getElementById('detailScreenshots');
    const ssRow = document.getElementById('screenshotsRow');
    const grid  = document.getElementById('project-detail').querySelector('.detail-grid');
    if (p.screenshots && p.screenshots.length) {
      ssRow.innerHTML = p.screenshots.map(src => `<img class="screenshot-img" src="${src}" alt="Screenshot">`).join('');
      ssEl.style.display = 'block';
      grid.style.gridTemplateColumns = '270px 1fr';
    } else {
      ssEl.style.display = 'none';
      grid.style.gridTemplateColumns = '400px';
    }
    document.querySelector('main').style.display = 'none';
    const detail = document.getElementById('project-detail');
    detail.style.setProperty('--detail-accent', p.accent || 'var(--accent)');
    detail.style.display = 'flex';
    // re-trigger animation
    detail.style.animation = 'none';
    detail.offsetHeight;
    detail.style.animation = '';
  }

  function closeDetail() {
    document.querySelector('main').style.display = '';
    document.getElementById('project-detail').style.display = 'none';
  }

  // Nav scroll shadow
  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
  });

  // Project carousel
  const track = document.getElementById('projectsTrack');
  const items = track.querySelectorAll('.project-item');
  const perView = 4;
  const gap = 10;
  let current = 0;
  const max = items.length - perView;

  function getItemWidth() {
    const carousel = track.parentElement;
    return (carousel.offsetWidth - gap * (perView - 1)) / perView;
  }

  function updateCarousel() {
    const w = getItemWidth();
    track.style.transform = `translateX(-${current * (w + gap)}px)`;
    const showArrows = max > 0;
    document.getElementById('projPrev').style.display = showArrows ? '' : 'none';
    document.getElementById('projNext').style.display = showArrows ? '' : 'none';
    if (showArrows) {
      document.getElementById('projPrev').style.opacity = current === 0 ? '0.3' : '1';
      document.getElementById('projNext').style.opacity = current === max ? '0.3' : '1';
    }
  }

  function changePage(dir) {
    const next = current + dir;
    if (next < 0 || next > max) return;
    current = next;
    updateCarousel();
  }

  // set fixed item widths on load and resize
  function initCarousel() {
    const w = getItemWidth();
    items.forEach((el, i) => {
      el.style.flex = `0 0 ${w}px`;
      const p = projects[i];
      if (p && p.logo) {
        el.style.background = p.gradient;
        if (p.accent) {
          const hex = p.accent;
          const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
          el.style.setProperty('--item-accent', hex);
          el.style.setProperty('--item-accent-glow', `rgba(${r},${g},${b},0.35)`);
          el.style.setProperty('--item-accent-dim', `rgba(${r},${g},${b},0.07)`);
          el.style.setProperty('--item-overlay', `rgba(${r},${g},${b},0.09)`);
        }
        const inner = el.querySelector('.project-item-inner');
        inner.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;padding:18px 18px 38px;';
        inner.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <img src="${p.logo}" style="width:44px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,0.6);">
            <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#ececec;line-height:1.1;letter-spacing:-0.3px;">${p.title}</span>
          </div>
          <span style="font-size:13px;color:rgba(255,255,255,0.78);line-height:1.65;font-weight:300;flex:1;overflow:hidden;align-self:stretch;display:flex;align-items:center;">${p.desc}</span>`;
      }
    });
    updateCarousel();
  }

  window.addEventListener('resize', initCarousel);
  initCarousel();
</script>
</body>
</html>
